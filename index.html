<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Slider Swiper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Swiper v6 -->
  <link rel="stylesheet" href="https://unpkg.com/swiper@6.8.4/swiper-bundle.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- SLIDER PRINCIPAL -->
<div class="swiper main-slider">
  <div class="swiper-wrapper">

    <!-- 12 SLIDES -->
    <div class="swiper-slide"><div class="slide-bgimg" style='background-image:url("images/img(2).png")'></div></div>
    <div class="swiper-slide"><div class="slide-bgimg" style='background-image:url("images/img(3).png")'></div></div>
    <div class="swiper-slide"><div class="slide-bgimg" style='background-image:url("images/img(4).png")'></div></div>
    <div class="swiper-slide"><div class="slide-bgimg" style='background-image:url("images/img(5).png")'></div></div>
    <div class="swiper-slide"><div class="slide-bgimg" style='background-image:url("images/img(6).png")'></div></div>
    <div class="swiper-slide"><div class="slide-bgimg" style='background-image:url("images/img(7).png")'></div></div>
    <div class="swiper-slide"><div class="slide-bgimg" style='background-image:url("images/img(8).png")'></div></div>
    <div class="swiper-slide"><div class="slide-bgimg" style='background-image:url("images/img(9).png")'></div></div>
    <div class="swiper-slide"><div class="slide-bgimg" style='background-image:url("images/img(10).png")'></div></div>
    <div class="swiper-slide"><div class="slide-bgimg" style='background-image:url("images/img(11).png")'></div></div>
    <div class="swiper-slide"><div class="slide-bgimg" style='background-image:url("images/img(12).png")'></div></div>
    <div class="swiper-slide"><div class="slide-bgimg" style='background-image:url("images/img(13).png")'></div></div>

  </div>

  <div class="swiper-button-next"></div>
  <div class="swiper-button-prev"></div>
</div>

<!-- THUMBNAILS -->
<div class="swiper nav-slider">
  <div class="swiper-wrapper">
    <div class="swiper-slide" style='background-image:url("images/img(2).png")'></div>
    <div class="swiper-slide" style='background-image:url("images/img(3).png")'></div>
    <div class="swiper-slide" style='background-image:url("images/img(4).png")'></div>
    <div class="swiper-slide" style='background-image:url("images/img(5).png")'></div>
    <div class="swiper-slide" style='background-image:url("images/img(6).png")'></div>
    <div class="swiper-slide" style='background-image:url("images/img(7).png")'></div>
    <div class="swiper-slide" style='background-image:url("images/img(8).png")'></div>
    <div class="swiper-slide" style='background-image:url("images/img(9).png")'></div>
    <div class="swiper-slide" style='background-image:url("images/img(10).png")'></div>
    <div class="swiper-slide" style='background-image:url("images/img(11).png")'></div>
    <div class="swiper-slide" style='background-image:url("images/img(12).png")'></div>
    <div class="swiper-slide" style='background-image:url("images/img(13).png")'></div>
  </div>
</div>

<script src="https://unpkg.com/swiper@6.8.4/swiper-bundle.min.js"></script>
<script src="js/main.js"></script>

</body>
</html>
